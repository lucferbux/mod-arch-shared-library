# pnpm settings for standalone / kubeflow deployments (single-package workspace).
# pnpm >=10 reads these from pnpm-workspace.yaml rather than package.json / .npmrc.
packages:
  - '.'

# Keep a flat node_modules layout so the rspack config's PatternFly asset/CSS include paths
# (node_modules/@patternfly/...) resolve without a pnpm-aware resolver. Mirrors the temporary
# approach odh-dashboard uses during its pnpm migration.
shamefullyHoist: true
autoInstallPeers: true

# Allow build scripts only for the dependencies that need them (pnpm blocks them by default).
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  cypress: true
  esbuild: true
  unrs-resolver: true

overrides:
  js-yaml: ^4.1.1
  csstype: 3.1.3
  axios: ^1.18.0
